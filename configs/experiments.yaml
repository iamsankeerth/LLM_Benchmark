dataset_version: eval-v1
dataset_path: evals/datasets/eval-v1/executable-v1.jsonl
baseline:
  suites: [core-v1, stress-v1]
  baseline_repeats: 3
  temperature: 0
  warmup_requests: 2
  pending_grading_policy: refuse_auto_grading
reliability:
  enabled: true
  suite_version: reliability-v1
  config: configs/reliability-v1.yaml
  repetitions: 5
  temperature: 0
  run_kind: RELIABILITY
temperature_study:
  enabled: false
  task_ids: []
  required_task_count: 15
  temperatures: [0, 0.7]
  repetitions: 5
optional_suites:
  coding-v1:
    enabled: false
    requires: executable_test_fixtures
  long-context-v1:
    enabled: false
    status: NOT_AUTHORED
  judge-bias-v1:
    enabled: false
    status: NOT_AUTHORED
