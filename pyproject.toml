[tool.mypy]
python_version = "3.12"

strict = true

warn_unused_configs = true
warn_unreachable = true
show_error_codes = true
pretty = true

exclude = [
    "^results/",
    "^evals/datasets/",
    "^\\.venv/",
    "^venv/"
]

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "urllib3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pynvml", "psutil.*"]
ignore_missing_imports = true
